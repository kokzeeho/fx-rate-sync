name: Daily FX Rate Update

on:
  schedule:
    # Midnight GMT+8 = 16:00 UTC the previous day
    - cron: "0 16 * * *"
  workflow_dispatch: {}  # allows manual trigger from the Actions tab for testing

permissions:
  contents: write  # needed so the workflow can commit the updated file back

jobs:
  update-fx-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FX update
        run: python fx_update.py

      - name: Commit updated file
        run: |
          git config user.name "fx-rate-bot"
          git config user.email "fx-rate-bot@users.noreply.github.com"
          git add SGDUSD_Tracker.xlsx
          git diff --quiet --cached || git commit -m "Daily FX rate update $(date +'%Y-%m-%d')"
          git push
